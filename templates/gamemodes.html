{% extends "layout.html" %}

{% block main %}



<div class="gamemodes-options" style="margin-top: 0%;">

    <h1 class="text-center mb-4">Gamemodes:</h1>

    <div class="d-grid gap-4 mx-auto" style="max-width: 400px;">
        
        <form id="singleplayer-form">
            <button type="submit" class="btn btn-green w-100 btn-lg d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-user me-3"></i>
                <span>SINGLEPLAYER</span>
            </button>
        </form>

        <form>
            <button type="submit" class="btn btn-green w-100 btn-lg d-flex align-items-center justify-content-center disabled">
                <i class="fa-solid fa-users me-3"></i>
                <span>MULTIPLAYER</span>
            </button>
        </form>

        <form>
            <button type="button" class="btn btn-green w-100 btn-lg d-flex align-items-center justify-content-center" onclick="openCustom();">
                <i class="fa-solid fa-sliders me-3"></i>
                <span>CUSTOM</span>
            </button>
        </form>
    </div>

    <div class="text-center mt-3">
         <button type="button" id="config-button" class="btn btn-outline-dark" onclick="openConfig();">
            <i class="fa-solid fa-gear me-2"></i> 
            SETTINGS
        </button>
    </div>

</div>

<div id="settings" class="floating-form shadow-lg" style="min-height: 300px;">
    <div class="d-flex justify-content-end m-3">
        <button type="button" class="btn-close" aria-label="Close" onclick="closeConfig()"></button>
    </div>
    
    <h2 style="text-align: center;">SETTINGS</h2>
    <div style="margin-top: 5%;" class="form-check form-switch">
        <input class="form-check-input" type="checkbox" role="switch" id="autoplay-switch">
        <label class="form-check-label" for="switchCheckChecked">Auto play</label>
    </div>
</div>

<div id="custom" class="floating-form shadow-lg">

    <div class="d-flex justify-content-end m-3">
        <button type="button" class="btn-close" aria-label="Close" onclick="closeCustom();"></button>
    </div>
    
    <h2 style="text-align: center;">CUSTOM GAMEMODE</h2>

    <form id="custom-form">
        <label for="url">Playlist/Album URL:</label><br>
        <input type="text" id="url" name="url" class="w-100" placeholder="https://open.spotify.com/playlist/37i9dQZEVXbMDoHDwVN2tF?si=sWF-9j8bRsK56xv8b04LXQ" required>
        <span id="urlError"></span><br><br>

        <label for="time">Time to answer (in seconds):</label><br>
        <input type="number" id="time" name="time" class="w-100" placeholder="15" value="15" min="1" max="99999" required><br><br>

        <button id="custom_game_button" type="submit" class="btn btn-green w-100">
            <i class="fa-solid fa-play me-2"></i> START
        </button>
    </form>

    <div id="loading" class="d-flex justify-content-center m-3">

    </div>
</div>

{% with messages = get_flashed_messages(with_categories=false) %}
{% if messages %}
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            alert("{{messages[0] | safe}}");
        });
    </script>
{% endif %}
{% endwith %}

{% endblock %}
